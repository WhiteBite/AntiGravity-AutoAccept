# .discoverability/project.yml
# Single source of truth for this repository's discoverability metadata.
# Consumed by: rdk audit / rdk fix / rdk github-sync / rdk npm-surface,
# the repo-discoverability skill, and the rdk-audit GitHub Action.
# Docs: https://github.com/WhiteBite/repo-aeo/blob/main/docs/configuration.md

schema_version: 1   # config schema revision; rdk warns on any other value

project:
  name: "antigravity-autoaccept"
  one_liner: "Auto-accept Run, Accept, and Always Allow buttons in Antigravity via CDP with Webview Guard isolation."   # 1 sentence, shown as the GitHub description
  description: "Auto-accept Run, Accept, and Always Allow buttons in Antigravity via CDP with Webview Guard isolation."
  category: "library"   # library | app | template | research | tool | dataset | mcp-server
  copyright_holder: "WhiteBite"   # name on the LICENSE copyright line; seeded from the git owner

audiences: []

use_cases: []   # 3-7 concrete jobs this project does

keywords:
  github_topics:
    - "open-source"
    - "developer-tools"
    - "library"
    - "antigravity"
    - "autoaccept"
    - "auto-accept"
    - "accept"
    - "always"
    - "allow"
    - "buttons"
    - "webview"
    - "guard"   # 8-20 terms, lowercase with hyphens
  npm_keywords:
    - "open-source"
    - "developer-tools"
    - "library"
    - "antigravity"
    - "autoaccept"
    - "auto-accept"
    - "accept"
    - "always"
    - "allow"
    - "buttons"
    - "webview"
    - "guard"   # 5-15 terms for package.json keywords

links:
  homepage: "https://github.com/yazanbaker94/AntiGravity-AutoAccept#readme"
  docs:
  demo:
  issues: "https://github.com/yazanbaker94/AntiGravity-AutoAccept/issues"

quickstart:
  prerequisites:
    - "Node.js >= 18"
  install: "npm install antigravity-autoaccept"
  run:
  test: "npm run test"

artifacts:
  has_npm_package: true
  has_docs_site: false

differentiators: []   # "why this repo, not the alternatives"

safety:
  allow_autofix: false          # lets the Action open autofix PRs
  require_ack_for_publish: true
  ack:   # optional override of the github-sync ACK string; empty keeps the default
